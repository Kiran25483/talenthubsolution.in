
{% extends "base.html" %}

{% block title %}Hire Talent | TalentHub Solutions{% endblock %}

{% block content %}

<div class="container page-section">

    <div class="form-container">

        <div class="page-heading mb-4">
            <p class="eyebrow">For employers</p>
            <h1>Build your next great team</h1>

            <p class="lead">Share the role and hiring details. Our recruitment team will follow up with a tailored shortlist.</p>
        </div>

      <form class="employer-form" method="POST">

            <div class="mb-3">

                  <label for="company" class="form-label">Company Name</label>

                <input type="text"
                      id="company"
                       name="company"
                       class="form-control"
                       required>

            </div>


            <div class="mb-3">

                  <label for="contact_person" class="form-label">Contact Person</label>

                <input type="text"
                      id="contact_person"
                       name="contact_person"
                       class="form-control"
                       required>

            </div>


            <div class="mb-3">

                  <label for="email" class="form-label">Work Email</label>

                <input type="email"
                      id="email"
                       name="email"
                       class="form-control"
                       required>

            </div>


            <div class="mb-3">

                  <label for="phone" class="form-label">Phone</label>

                <input type="text"
                      id="phone"
                       name="phone"
                       class="form-control">

            </div>


            <div class="mb-3">

                  <label for="job_title" class="form-label">Role to fill</label>

                <input type="text"
                      id="job_title"
                       name="job_title"
                       class="form-control"
                       required>

            </div>


            <div class="mb-3">

                  <label for="openings" class="form-label">Number of Openings</label>

                <input type="number"
                      id="openings"
                       name="openings"
                       class="form-control"
                       min="1">

            </div>


            <div class="mb-3">

                <label for="description" class="form-label">Role Details</label>

                <textarea name="description"
                          id="description"
                          class="form-control"
                          rows="6"></textarea>

            </div>


            <button class="btn btn-primary">
                Submit Requirement
            </button>

        </form>

    </div>

</div>

{% endblock %}
