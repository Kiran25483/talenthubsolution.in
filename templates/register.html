
{% extends "base.html" %}

{% block title %}Create Account | TalentHub Solutions{% endblock %}

{% block content %}

<div class="container page-section auth-page">

    <div class="form-container auth-card">

        <p class="eyebrow">Join the network</p>
        <h1>Create Your Account</h1>

        <p>
            Register with TalentHub Solution to explore
            suitable career opportunities.
        </p>

        <form method="POST" data-password-confirmation>

            <!-- Name -->
            <div class="mb-3">

                <label for="name" class="form-label">
                    Full Name
                </label>

                <input type="text"
                       id="name"
                       name="name"
                       class="form-control"
                       autocomplete="name"
                       placeholder="Enter your full name"
                       required>

            </div>


            <!-- Email -->
            <div class="mb-3">

                <label for="email" class="form-label">
                    Email
                </label>

                <input type="email"
                       id="email"
                       name="email"
                       class="form-control"
                       autocomplete="email"
                       placeholder="Enter your email"
                       required>

            </div>


            <!-- Phone -->
            <div class="mb-3">

                <label for="phone" class="form-label">
                    Phone
                </label>

                <input type="tel"
                       id="phone"
                       name="phone"
                       class="form-control"
                       autocomplete="tel"
                       placeholder="Enter your phone number">

            </div>


            <!-- Password -->
            <div class="mb-3">

                <label for="password" class="form-label">
                    Password
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       autocomplete="new-password"
                       placeholder="Create a password"
                       minlength="6"
                       required>

            </div>


            <!-- Confirm Password -->
            <div class="mb-3">

                <label for="confirm_password" class="form-label">
                    Confirm Password
                </label>

                <input type="password"
                       id="confirm_password"
                       name="confirm_password"
                       class="form-control"
                       autocomplete="new-password"
                       placeholder="Confirm your password"
                       minlength="6"
                       required>

            </div>


            <button type="submit"
                    class="btn btn-primary w-100">

                Create Account

            </button>

        </form>


        <p class="mt-3 text-center">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
