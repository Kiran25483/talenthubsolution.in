{% extends "base.html" %}

{% block title %}Contact | TalentHub Solutions{% endblock %}

{% block content %}

<div class="container page-section">

    <div class="row">

        <div class="col-md-5">

            <h1>Contact Us</h1>

            <p>
                Have a hiring requirement or looking
                for a new opportunity?
            </p>

            <p>
                <strong>Email:</strong><br>
                hr@talenthubsolutions.com
            </p>

            <p>
                <strong>Phone:</strong><br>
                +91 XXXXX XXXXX
            </p>

            <p>
                <strong>Location:</strong><br>
                Delhi NCR, India
            </p>

        </div>


        <div class="col-md-7">

            <div class="form-container">

                <form method="POST">

                    <input type="text"
                           name="name"
                           class="form-control mb-3"
                           placeholder="Your Name"
                           required>

                    <input type="email"
                           name="email"
                           class="form-control mb-3"
                           placeholder="Email"
                           required>

                    <input type="text"
                           name="phone"
                           class="form-control mb-3"
                           placeholder="Phone">

                    <textarea name="message"
                              class="form-control mb-3"
                              rows="6"
                              placeholder="Your Message"></textarea>

                    <button class="btn btn-primary">
                        Send Message
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
