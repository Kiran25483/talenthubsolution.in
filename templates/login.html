
{% extends "base.html" %}

{% block title %}Login | TalentHub Solutions{% endblock %}

{% block content %}

<div class="container page-section auth-page">

    <div class="form-container auth-card">

        <p class="eyebrow">Welcome back</p>
        <h1>Candidate Login</h1>

        <p>
            Login to access your TalentHub Solution account.
        </p>

        <form method="POST" autocomplete="on">

            <!-- Email -->
            <div class="mb-3">

                <label for="email" class="form-label">
                    Email
                </label>

                <input type="email"
                       id="email"
                       name="email"
                       class="form-control"
                       autocomplete="email"
                       placeholder="Enter your email"
                       required>

            </div>


            <!-- Password -->
            <div class="mb-3">

                <label for="password" class="form-label">
                    Password
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       autocomplete="current-password"
                       placeholder="Enter your password"
                       required>

            </div>


            <button type="submit"
                    class="btn btn-primary w-100">

                Login

            </button>

        </form>


        <p class="mt-3 text-center">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </p>

    </div>

</div>

{% endblock %}
